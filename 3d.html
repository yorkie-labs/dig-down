<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <title>Dig Down</title>
  <!-- PWA: installable, full screen from the home screen; works offline once loaded (sw.js) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#163d7a" />
  <link rel="icon" type="image/png" href="icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dig Down" />
  <link rel="preload" href="fonts/jua.woff2" as="font" type="font/woff2" crossorigin />
  <!-- page styles live in src/game3d.css, imported after style.css by main3d.ts: as an inline
       <style> the build placed it BEFORE the bundled style.css link, so the legacy 2D rules
       (Comic Sans, black shadows) overrode the game's look on the deployed site -->
</head>
<body>
  <!-- loading screen: plain HTML/CSS so it shows while the JS bundle downloads (src/loading.ts) -->
  <div id="loading" role="progressbar" aria-label="불러오는 중">
    <div class="ld-logo"><span class="d">Dig</span> <span class="w">Down</span></div>
    <div class="ld-dog" aria-hidden="true">🐶<span class="ld-dirt">⛏️</span></div>
    <div class="ld-track"><div id="loading-bar"></div></div>
    <p class="ld-text">얼음 파는 중… <span id="loading-pct">0%</span></p>
  </div>
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud">
    <div class="hud-top">
      <div class="hud-row">
        <span id="lives" role="img" aria-label="목숨"></span>
        <span id="depth"><b id="depth-m">0</b><span class="u">m</span><span class="lv" id="depth-lv"></span></span>
        <span id="score"></span>
      </div>
      <button id="pause-btn" type="button" aria-label="일시정지">⏸</button>
    </div>
    <div id="air-row">
      <span id="air-label"><span id="air-icon" aria-hidden="true">🫧</span><span id="air-text"></span></span>
      <div id="air" role="meter" aria-label="공기" aria-valuemin="0" aria-valuemax="100"><div id="air-fill"></div></div>
    </div>
    <p id="medal-line" hidden></p>
  </div>
  <button id="mute" type="button" aria-label="소리 끄기">🔊</button>
  <div id="pause" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <div class="card">
      <h2 id="pause-title">일시정지</h2>
      <button id="pm-resume" class="primary" type="button">▶ 계속 <span class="key">(Esc)</span></button>
      <button id="pm-restart" type="button">다시 하기 <span class="key">(R)</span></button>
      <button id="pm-stages" type="button">스테이지 선택 <span class="key">(S)</span></button>
      <button id="pm-sound" type="button"></button>
    </div>
  </div>
  <p id="style-label" style="position:fixed;top:72px;left:0;right:0;margin:0;text-align:center;font-size:18px;font-weight:bold;color:#ffe14a;text-shadow:2px 2px 0 #000;pointer-events:none"></p>
  <p id="render-label" style="position:fixed;top:96px;left:0;right:0;margin:0;text-align:center;font-size:16px;font-weight:bold;color:#9ff7ff;text-shadow:2px 2px 0 #000;pointer-events:none"></p>
  <p id="hint">←→ 이동 · ↑↓ 방향 · Space/Z 망치 · R 재시작 · Esc 일시정지 · M 소리<span class="dev-only"> · C 그림체 · P 픽셀 ([ ] 해상도)</span></p>
  <p id="hint-touch">◀▶ 이동 · ▲▼ 방향 · 망치 버튼으로 깨기 · ⏸ 일시정지·소리</p>
  <p id="tip" role="status" hidden></p>
  <div id="title">
    <div class="logo"><span class="d">Dig</span> <span class="w">Down</span></div>
    <p class="sub">얼음 아래로, 강아지의 굴착 모험</p>
    <button id="collection" type="button" hidden></button>
    <div id="stage-panel">
      <p class="panel-head"><span>스테이지</span><span class="stars-total" id="stars-total"></span></p>
      <div id="stage-list"></div>
    </div>
    <p id="build-tag" aria-hidden="true"></p>
    <p class="press"><span class="keys">↑↓ 스테이지 선택 · Space로 시작 · B 도감</span><span class="taps">탭해서 고르고, 한 번 더 탭하면 시작</span></p>
  </div>
  <div id="book" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="book-title">
      <div class="head">
        <h2 id="book-title">📖 도감</h2>
        <button type="button" id="book-close" aria-label="도감 닫기">✕</button>
      </div>
      <p class="totals" id="book-totals"></p>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="book-tab-badges" aria-controls="book-pane-badges">🏅 배지</button>
        <button type="button" role="tab" id="book-tab-wear" aria-controls="book-pane-wear">🐶 꾸미기</button>
        <button type="button" role="tab" id="book-tab-days" aria-controls="book-pane-days">☀️ 오늘의 코스</button>
      </div>
      <div class="pane" role="tabpanel" id="book-pane-badges" aria-labelledby="book-tab-badges"><ul id="book-list"></ul></div>
      <div class="pane" role="tabpanel" id="book-pane-wear" aria-labelledby="book-tab-wear"><ul id="book-wear"></ul></div>
      <div class="pane" role="tabpanel" id="book-pane-days" aria-labelledby="book-tab-days">
        <h3>최근 14일</h3>
        <div id="book-days" class="days"></div>
      </div>
      <p class="close"><span class="keys">←→ 탭 바꾸기 · Esc·B 닫기</span></p>
    </div>
  </div>
  <div id="overlay" hidden>
    <div class="card">
      <p id="overlay-title"></p>
      <p id="res-stage"></p>
      <p id="res-stars" role="img"></p>
      <div id="res-hero"></div>
      <p id="res-cause" hidden></p>
      <p id="res-goal" hidden></p>
      <ul id="res-news"></ul>
      <dl id="overlay-stats"></dl>
      <div id="res-actions">
        <button id="restart" type="button">다시 하기 <span class="key">(R)</span></button>
        <button id="next-stage" type="button" hidden></button>
        <button id="share" type="button" hidden>📋 공유</button>
        <input id="share-text" type="text" readonly hidden aria-label="공유 문구" />
        <button id="to-stages" type="button">스테이지 선택 <span class="key">(S)</span></button>
      </div>
    </div>
  </div>
  <div id="pad">
    <div id="stick-zone" aria-label="이동 스틱"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div class="dpad">
      <button data-dir="up" aria-label="위">▲</button>
      <button data-dir="left" aria-label="왼쪽">◀</button>
      <button data-dir="down" aria-label="아래">▼</button>
      <button data-dir="right" aria-label="오른쪽">▶</button>
    </div>
    <button id="drill-btn" aria-label="망치"><span class="disc">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="17.5" y="15" width="5" height="22" rx="2" fill="#c98a3c"/>
        <path d="M7 6 h22 l3 3 v7 h-25 z" fill="#9aa6bf"/>
        <path d="M10 9.5 h15" style="stroke: var(--cream)" stroke-width="2" fill="none"/>
      </g></svg></span></button>
  </div>
  <script>if (new URLSearchParams(location.search).has('dev')) document.body.classList.add('dev');</script>
  <script type="module" src="/src/main3d.ts"></script>
</body>
</html>
